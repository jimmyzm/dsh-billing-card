# Publishes the package to npm when a GitHub release is published, so the npm
# version is provably built from this repository at this tag.
#
# The suite runs here as well as in ci.yml: a release must never publish a tree
# that main's own CI would have rejected, and this job is the only writer.
#
# One-time setup on npmjs.com: Package settings → Trusted publishing → add this
# repository (Jimmyzm/dsh-billing-card) with workflow name `publish.yml`. No
# token secret is needed; the job authenticates with GitHub's OIDC identity.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org

      # The tag is the only place a version is decided: refuse to publish a tree
      # whose package.json does not match the release that triggered this run.
      - name: Check the tag against the version
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ] && [ "$tag" != "$version" ]; then
            echo "::error::release tag '$tag' does not match package.json version '$version'"
            exit 1
          fi
          echo "publishing $version from $tag"

      - name: Syntax check
        run: node --check index.js && node --check parse.js && node --check client.js

      - name: Test
        run: npm test

      # Nothing outside the declared runtime surface may ship: docs/, test/,
      # .agents/ and AGENTS.md are repository-only.
      - name: Check the tarball contents
        run: npm publish --dry-run

      # A re-run, or a release published twice, must not turn red: the version is
      # already on the registry, and publishing it again only produces
      # `E403 cannot publish over the previously published versions`. Ask the
      # version document directly rather than the packument, which can lag.
      - id: registry
        name: Check whether the version is already published
        run: |
          version="$(node -p "require('./package.json').version")"
          url="https://registry.npmjs.org/@jimmyzm%2Fdsh-billing-card/${version}"
          if curl -fsS --max-time 20 "$url" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@jimmyzm/dsh-billing-card@${version} is already on the registry; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (OIDC) needs npm >= 11.5; the npm bundled with the
      # Node image is older and would fall back to a token. Pinned to the 11
      # major on purpose: `@latest` moved to a major whose publish path the
      # trusted-publisher endpoint answers with 404.
      - name: Upgrade npm
        run: |
          npm install --global npm@11
          npm --version

      - name: Publish with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
